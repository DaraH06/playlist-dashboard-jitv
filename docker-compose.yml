services:
  playout-app:
    build: .
    container_name: playout_app
    command: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:8043 app:app
    ports:
      - "8043:8043"
    environment:
      - PYTHONUNBUFFERED=1
      - RTMP_TARGET=${DASHBOARD_RTMP_URL}
    volumes:
      - /mnt/videoserver:/mnt/videoserver
      - .:/app
    restart: always
