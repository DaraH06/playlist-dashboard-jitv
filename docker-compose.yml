services:
  playout-app:
    build: .
    container_name: playout_app
    command: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:8043 app:app
    ports:
      - "8043:8043"
    environment:
      - PYTHONUNBUFFERED=1
      - RTMP_TARGET=${DASHBOARD_RTMP_URL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/videoserver:/mnt/videoserver
      - .:/app
    restart: always
    depends_on:
      - mediamtx

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: media
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC / WHEP
      - "9997:9997" # API
      - "8890:8890" # SRT
    restart: unless-stopped
