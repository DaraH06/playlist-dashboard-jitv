services:
  playout-app:
    build: .
    container_name: playout_app
    command: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:8043 app:app
    ports:
      - "8043:8043"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${HOST_VIDEO_ROOT}:${VIDEO_ROOT}
      - .:/app
    restart: always
